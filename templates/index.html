<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartTrip - Intelligent Travel Planning</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css"></head>
<body><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand" href="/">SmartTrip <span>AI</span></a><a class="nav-link" href="/insights">How SmartTrip Thinks</a></div></nav>
<main><section class="hero container"><div><p class="eyebrow">INTELLIGENT TRAVEL ASSISTANT</p><h1>Your Journey,<br><em>Intelligently Planned.</em></h1><p>Search, reason and plan your next Indian trip with visible AI algorithms.</p><a href="#planner" class="btn btn-primary">Plan My Trip</a></div></section>
<section class="container planner" id="planner"><h2>Tell us about your trip</h2><form id="trip-form" class="row g-3">
<div class="col-md-6"><label>Starting location</label><input class="form-control" name="starting_location" placeholder="Hyderabad" required></div>
<div class="col-md-3"><label>Budget (INR)</label><input class="form-control" type="number" name="budget" min="1" required></div>
<div class="col-md-3"><label>Days</label><input class="form-control" type="number" name="days" min="1" required></div>
<div class="col-md-4"><label>Travellers</label><input class="form-control" type="number" name="travellers" value="1" min="1"></div>
<div class="col-md-4"><label>Transport</label><select class="form-control" name="transport"><option>Any</option><option>Train</option><option>Bus</option><option>Flight</option></select></div>
<div class="col-md-4"><label>Accommodation</label><select class="form-control" name="accommodation"><option>Any</option><option>Hotel</option><option>Homestay</option><option>Hostel</option><option>Resort</option></select></div>
<div class="col-12"><label>Interests</label><div class="interest-grid"><label><input type="checkbox" value="Nature"> Nature</label><label><input type="checkbox" value="Adventure"> Adventure</label><label><input type="checkbox" value="Waterfalls"> Waterfalls</label><label><input type="checkbox" value="Beaches"> Beaches</label><label><input type="checkbox" value="Trekking"> Trekking</label><label><input type="checkbox" value="History"> History</label><label><input type="checkbox" value="Culture"> Culture</label><label><input type="checkbox" value="Sightseeing"> Sightseeing</label><label><input type="checkbox" value="Nightlife"> Nightlife</label><label><input type="checkbox" value="Wildlife"> Wildlife</label></div></div>
<div class="col-md-12"><label>Travel preference</label><select class="form-control" name="travel_preference"><option>Budget</option><option selected>Balanced</option><option>Comfort</option></select></div>
<div class="col-12"><button class="btn btn-primary" type="submit">Generate AI plan</button></div></form></section>
<section class="container results" id="results"><div id="plan-output"></div></section></main>
<script src="/static/js/script.js"></script></body></html>
